name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate plugin manifest
        uses: noctalia-dev/official-plugins/.github/actions/validate-plugins@5dc1d19b1aa6be331ee6506034dc8448aca5c446 # main
        with:
          profile: community
          root: ${{ github.workspace }}

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --release

      - name: Check the catalog matches the manifest
        run: python3 .github/scripts/check-catalog.py

      - name: Check licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Check the generated plugin directory
        run: |
          cargo run --release -- emit "$RUNNER_TEMP/plugin" timed-helper
          diff -r --exclude=timed-helper "$RUNNER_TEMP/plugin" timed

      - name: Check the committed helper
        run: |
          test -x timed/timed-helper
          if readelf -d timed/timed-helper 2>/dev/null | grep -q NEEDED; then
            echo "timed-helper is dynamically linked" >&2
            exit 1
          fi
          echo "timed-helper is statically linked"

  luau:
    name: Luau reference implementation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Luau
        env:
          LUAU_VERSION: "0.747"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/luau.zip" \
            "https://github.com/luau-lang/luau/releases/download/$LUAU_VERSION/luau-ubuntu.zip"
          unzip -q "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/luau"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"

      - name: Test duration parsing
        run: luau bench/luau/tests/duration_test.luau

      - name: Test timer commands
        run: luau bench/luau/tests/timers_test.luau -a "$(cat bench/luau/lib/timers.luau)"

      - name: Install luau-lsp
        env:
          LUAU_LSP_VERSION: "1.70.1"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/luau-lsp.zip" \
            "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$LUAU_LSP_VERSION/luau-lsp-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/luau-lsp.zip" -d "$RUNNER_TEMP/luau-lsp"
          echo "$RUNNER_TEMP/luau-lsp" >> "$GITHUB_PATH"

      - name: Fetch the Noctalia API definitions
        env:
          DEFINITIONS_COMMIT: 5dc1d19b1aa6be331ee6506034dc8448aca5c446
        run: |
          curl -fsSL -o "$RUNNER_TEMP/noctalia.d.luau" \
            "https://raw.githubusercontent.com/noctalia-dev/official-plugins/$DEFINITIONS_COMMIT/noctalia.d.luau"

      - name: Analyze Luau
        run: luau-lsp analyze --definitions="$RUNNER_TEMP/noctalia.d.luau" bench/luau
