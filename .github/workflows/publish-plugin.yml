name: Publish to Noctalia store

on:
  workflow_dispatch:
    inputs:
      summary:
        description: What changed in this version
        required: true
        type: string
      tested_on:
        description: Compositor tested with this version
        required: true
        type: choice
        default: Hyprland
        options:
          - Hyprland
          - Niri
          - Sway
      noctalia_version:
        description: Noctalia version tested against
        required: true
        default: "5.5.0"
        type: string
      dry_run:
        description: Print the sync diff without pushing or opening a PR
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-plugin
  cancel-in-progress: false

env:
  COMMUNITY_REPO: noctalia-dev/community-plugins
  FORK_REPO: DontBlameMeDev/community-plugins
  PLUGIN_DIR: timed
  PLUGIN_ID: dontblameme/timed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the plugin version
        id: plugin
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$PLUGIN_DIR/plugin.toml")"
          api="$(sed -n 's/^plugin_api = \(.*\)$/\1/p' "$PLUGIN_DIR/plugin.toml")"
          {
            echo "version=$version"
            echo "api=$api"
          } >> "$GITHUB_OUTPUT"

      - name: Check the token
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.COMMUNITY_PLUGINS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add a COMMUNITY_PLUGINS_TOKEN secret with public_repo scope."
            exit 1
          fi

      - name: Clone the fork
        env:
          TOKEN: ${{ secrets.COMMUNITY_PLUGINS_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            url="https://x-access-token:${TOKEN}@github.com/${FORK_REPO}.git"
          else
            url="https://github.com/${FORK_REPO}.git"
          fi
          git clone --depth 1 --filter=blob:none --sparse "$url" community
          git -C community sparse-checkout set .github "$PLUGIN_DIR"
          git -C community remote add upstream "https://github.com/${COMMUNITY_REPO}.git"
          git -C community fetch --depth 1 upstream main
          git -C community reset --hard FETCH_HEAD

      - name: Read the published version
        id: published
        run: |
          file="community/$PLUGIN_DIR/plugin.toml"
          if [ -f "$file" ]; then
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$file")"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync the plugin directory
        id: sync
        run: |
          rsync -a --delete "$PLUGIN_DIR/" "community/$PLUGIN_DIR/"
          if git -C community status --porcelain -- "$PLUGIN_DIR" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already published at version ${{ steps.plugin.outputs.version }}."
          fi

      - name: Require a version bump
        if: steps.sync.outputs.changed == 'true'
        run: |
          old="${{ steps.published.outputs.version }}"
          new="${{ steps.plugin.outputs.version }}"
          if [ -z "$old" ]; then
            echo "::error::$PLUGIN_DIR is not in the community repository yet. Submit its first version manually."
            exit 1
          fi
          if [ "$old" = "$new" ]; then
            echo "::error::Bump version in $PLUGIN_DIR/plugin.toml. It is still $new."
            exit 1
          fi
          echo "Publishing $old -> $new."

      - name: Show the diff
        if: steps.sync.outputs.changed == 'true'
        run: git -C community diff --stat -- "$PLUGIN_DIR"

      - name: Look for an open pull request
        id: openpr
        if: ${{ steps.sync.outputs.changed == 'true' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_PLUGINS_TOKEN }}
          VERSION: ${{ steps.plugin.outputs.version }}
        run: |
          branch="${PLUGIN_DIR}-${VERSION}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "stop=false" >> "$GITHUB_OUTPUT"
          echo "exists=false" >> "$GITHUB_OUTPUT"
          found="$(gh pr list --repo "$COMMUNITY_REPO" --state open --search "$PLUGIN_ID" --json number,headRefName --jq '.[0] | if . == null then "" else "\(.number) \(.headRefName)" end')"
          if [ -n "$found" ]; then
            number="${found%% *}"
            head="${found#* }"
            if [ "$head" = "$branch" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "PR #$number covers $PLUGIN_ID from $branch."
            else
              echo "stop=true" >> "$GITHUB_OUTPUT"
              echo "::notice::PR #$number already covers $PLUGIN_ID. Wait for it to merge."
            fi
          fi

      - name: Push the update branch
        if: ${{ !inputs.dry_run && steps.openpr.outputs.stop != 'true' }}
        run: |
          branch="${{ steps.openpr.outputs.branch }}"
          version="${{ steps.plugin.outputs.version }}"
          git -C community config user.name "github-actions[bot]"
          git -C community config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C community checkout -b "$branch"
          git -C community add -A -- "$PLUGIN_DIR"
          git -C community commit -m "feat: update $PLUGIN_ID to $version"
          git -C community push --force origin "$branch"

      - name: Open the pull request
        if: ${{ !inputs.dry_run && steps.openpr.outputs.stop != 'true' && steps.openpr.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_PLUGINS_TOKEN }}
          SUMMARY: ${{ inputs.summary }}
          TESTED_ON: ${{ inputs.tested_on }}
          NOCTALIA_VERSION: ${{ inputs.noctalia_version }}
          API: ${{ steps.plugin.outputs.api }}
          BRANCH: ${{ steps.openpr.outputs.branch }}
        run: |
          python3 .github/scripts/community-pr-body.py > "$RUNNER_TEMP/pr.md"
          version="${{ steps.plugin.outputs.version }}"
          gh pr create --repo "$COMMUNITY_REPO" --base main --head "DontBlameMeDev:${BRANCH}" \
            --title "feat: update $PLUGIN_ID to $version" --body-file "$RUNNER_TEMP/pr.md"

      - name: Report the synced version
        if: ${{ !inputs.dry_run && steps.openpr.outputs.stop != 'true' }}
        run: |
          echo "::notice::$PLUGIN_ID ${{ steps.plugin.outputs.version }} is on branch ${{ steps.openpr.outputs.branch }}."
