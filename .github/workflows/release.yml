name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # A write deploy key is the actor that bypasses the main ruleset here.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Bump the version
        id: bump
        run: |
          version="$(python3 .github/scripts/bump-version.py "${{ inputs.bump }}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the catalog
        run: python3 .github/scripts/check-catalog.py

      - name: Push the version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timed/plugin.toml catalog.toml
          git commit --message "chore: bump version to $VERSION"
          git push origin HEAD:main

      - name: Publish the release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
