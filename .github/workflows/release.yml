name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      summary:
        description: What changed in this version
        required: true
        type: string
      tested_on:
        description: Compositor tested with this version
        required: true
        default: Hyprland
        type: choice
        options:
          - Hyprland
          - Niri
          - Sway
      noctalia_version:
        description: Noctalia version tested against
        required: true
        default: "5.5.0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump the version
        id: bump
        run: |
          version="$(python3 .github/scripts/bump-version.py "${{ inputs.bump }}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timed/plugin.toml catalog.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main

      - name: Publish to the community store
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ inputs.summary }}
          TESTED_ON: ${{ inputs.tested_on }}
          NOCTALIA_VERSION: ${{ inputs.noctalia_version }}
        run: |
          gh workflow run publish-plugin.yml --ref main \
            -f summary="$SUMMARY" \
            -f tested_on="$TESTED_ON" \
            -f noctalia_version="$NOCTALIA_VERSION" \
            -f dry_run=false
