name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump the version
        id: bump
        run: |
          version="$(python3 .github/scripts/bump-version.py "${{ inputs.bump }}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the catalog
        run: python3 .github/scripts/check-catalog.py

      - name: Push the release branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "release/$VERSION"
          git add timed/plugin.toml catalog.toml
          git commit --message "chore: bump version to $VERSION"
          expected="$(git ls-remote origin "refs/heads/release/$VERSION" | cut -f1)"
          git push --force-with-lease="refs/heads/release/$VERSION:$expected" origin "HEAD:release/$VERSION"

      - name: Open the release pull request
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if ! gh pr view "release/$VERSION" --json number --jq .number > /dev/null 2>&1; then
            gh pr create --base main --head "release/$VERSION" \
              --title "chore: bump version to $VERSION" \
              --body "Bumps the version in \`timed/plugin.toml\` and \`catalog.toml\` to $VERSION."
          fi

      - name: Merge the release pull request
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if [ "$(gh pr view "release/$VERSION" --json state --jq .state)" != "MERGED" ]; then
            gh pr merge "release/$VERSION" --squash --auto
          fi
