[package]
name = "timed-bench"
description = "Compares the Luau Timed implementation with the Rust one"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "timed-bench"
path = "src/main.rs"

[lints]
# Dev-only harness: the workspace lints target shipped plugin code.

[dependencies]
noctalia-rs = "0.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
timed = { path = ".." }
