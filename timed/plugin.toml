id = "dontblameme/timed"
name = "Timed"
version = "1.4.0"
plugin_api = 48
author = "DontBlameMe"
license = "GPL-3.0-or-later"
description = "Start, pause, resume, and stop countdown timers from the bar or launcher."
tags = ["launcher", "bar", "panel", "service", "countdown", "time", "utility"]
icon = "clock"
dependencies = []


  [[setting]]
key = "always_available"
label_key = "settings.always_available.label"
description_key = "settings.always_available.description"
type = "bool"
default = false

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "timed_indicator"
entry = "bar.luau"

  [[widget.setting]]
key = "show_text"
label_key = "settings.show_text.label"
description_key = "settings.show_text.description"
type = "bool"
default = true

  [[widget.setting]]
key = "show_count"
label_key = "settings.show_count.label"
description_key = "settings.show_count.description"
type = "bool"
default = true

  [[widget.setting]]
key = "show_progress"
label_key = "settings.show_progress.label"
description_key = "settings.show_progress.description"
type = "bool"
default = true

  [[widget.setting]]
key = "hide_when_idle"
label_key = "settings.hide_when_idle.label"
description_key = "settings.hide_when_idle.description"
type = "bool"
default = false

  [[widget.setting]]
key = "use_urgency_colors"
label_key = "settings.use_urgency_colors.label"
description_key = "settings.use_urgency_colors.description"
type = "bool"
default = true

  [[widget.setting]]
key = "safe_color"
label_key = "settings.safe_color.label"
description_key = "settings.safe_color.description"
type = "select"
default = "tertiary"

  [[widget.setting.options]]
value = "primary"
label_key = "settings.color.primary"

  [[widget.setting.options]]
value = "secondary"
label_key = "settings.color.secondary"

  [[widget.setting.options]]
value = "tertiary"
label_key = "settings.color.tertiary"

  [[widget.setting.options]]
value = "error"
label_key = "settings.color.error"

  [[widget.setting.options]]
value = "on_surface"
label_key = "settings.color.on_surface"

  [[widget.setting.options]]
value = "on_surface_variant"
label_key = "settings.color.on_surface_variant"

  [[widget.setting]]
key = "warning_color"
label_key = "settings.warning_color.label"
description_key = "settings.warning_color.description"
visible_when = { key = "use_urgency_colors", values = ["true"] }
type = "select"
default = "secondary"

  [[widget.setting.options]]
value = "primary"
label_key = "settings.color.primary"

  [[widget.setting.options]]
value = "secondary"
label_key = "settings.color.secondary"

  [[widget.setting.options]]
value = "tertiary"
label_key = "settings.color.tertiary"

  [[widget.setting.options]]
value = "error"
label_key = "settings.color.error"

  [[widget.setting.options]]
value = "on_surface"
label_key = "settings.color.on_surface"

  [[widget.setting.options]]
value = "on_surface_variant"
label_key = "settings.color.on_surface_variant"

  [[widget.setting]]
key = "urgent_color"
label_key = "settings.urgent_color.label"
description_key = "settings.urgent_color.description"
visible_when = { key = "use_urgency_colors", values = ["true"] }
type = "select"
default = "error"

  [[widget.setting.options]]
value = "primary"
label_key = "settings.color.primary"

  [[widget.setting.options]]
value = "secondary"
label_key = "settings.color.secondary"

  [[widget.setting.options]]
value = "tertiary"
label_key = "settings.color.tertiary"

  [[widget.setting.options]]
value = "error"
label_key = "settings.color.error"

  [[widget.setting.options]]
value = "on_surface"
label_key = "settings.color.on_surface"

  [[widget.setting.options]]
value = "on_surface_variant"
label_key = "settings.color.on_surface_variant"

  [[widget.setting]]
key = "idle_color"
label_key = "settings.idle_color.label"
description_key = "settings.idle_color.description"
type = "select"
default = "primary"

  [[widget.setting.options]]
value = "primary"
label_key = "settings.color.primary"

  [[widget.setting.options]]
value = "secondary"
label_key = "settings.color.secondary"

  [[widget.setting.options]]
value = "tertiary"
label_key = "settings.color.tertiary"

  [[widget.setting.options]]
value = "error"
label_key = "settings.color.error"

  [[widget.setting.options]]
value = "on_surface"
label_key = "settings.color.on_surface"

  [[widget.setting.options]]
value = "on_surface_variant"
label_key = "settings.color.on_surface_variant"

[[launcher_provider]]
id = "launcher"
entry = "launcher.luau"
prefix = "timer"
glyph = "clock"
include_in_global_search = false

[[launcher_provider]]
id = "launcher_global"
entry = "launcher_global.luau"
prefix = "always"
glyph = "clock"
include_in_global_search = true

[[panel]]
id = "panel"
entry = "panel.luau"
open_near_click = true
width = 380
height = 360
placement = "attached"
position = "auto"
